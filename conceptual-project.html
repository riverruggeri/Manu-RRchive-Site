<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manu Conceptual Art</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;800&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20261122233641">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="ЯRchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="stylesheet" href="assets/projects.css?v=20261122233641">
<style>
  /* One Conceptual Art project on its own page (River, 2026-11-22; Tracy Ma idea 5):
     photos on one side, the write-up in River's own words on the other. */
  .piece-page {
    display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
    gap: clamp(32px, 5vw, 80px); align-items: start;
    padding: clamp(96px, 13vh, 140px) clamp(20px, 4.4vw, 64px) 80px;
    max-width: 1500px; margin: 0 auto;
  }
  .gallery .main { display: block; width: auto; max-width: 100%; height: auto; max-height: calc(100vh - 250px); border-radius: 6px; }
  .thumbs-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .thumbs-row button { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 4px; overflow: hidden; opacity: 0.55; transition: opacity 0.2s; outline-offset: 2px; }
  .thumbs-row button[aria-current="true"], .thumbs-row button:hover { opacity: 1; }
  .thumbs-row img { width: 64px; height: 80px; object-fit: cover; display: block; }
  .words { position: sticky; top: clamp(96px, 13vh, 140px); }
  .words .kicker { font-size: 11px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--ink-soft); margin: 0 0 12px; }
  .words h1 { margin: 0 0 24px; font-size: clamp(40px, 5.4vw, 76px); font-weight: 800; letter-spacing: -0.05em; line-height: 0.92; }
  .words .say { display: block; border: 0; padding: 0; margin: 0; }
  .words .say p { margin: 0 0 18px; font-size: clamp(19px, 1.7vw, 25px); line-height: 1.42; letter-spacing: -0.01em; max-width: 26em; }
  .words .details { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 26px 0 0; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-soft); }
  .piece-nav { display: flex; justify-content: space-between; gap: 16px; margin-top: 40px; }
  .piece-nav a { color: var(--ink); text-decoration: none; font-size: 12px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; padding: 11px 16px; border-radius: 99px; box-shadow: inset 0 0 0 1px var(--ink); transition: background-color 0.2s, color 0.2s; }
  .piece-nav a:hover, .piece-nav a:focus-visible { background: var(--ink); color: var(--cream); outline: none; }
  @media (max-width: 820px) {
    .piece-page { grid-template-columns: 1fr; padding-top: calc(80px + env(safe-area-inset-top, 0px)); }
    .words { position: static; }
    .gallery .main { width: 100%; max-height: none; }
    .thumbs-row img { width: 54px; height: 68px; }
    .words h1 { font-size: 44px; }
    .words .say p { font-size: 19px; }
    .piece-nav { flex-wrap: wrap; }
  }
</style>
</head>
<body class="light long">
<main class="piece-page" id="piece"></main>

<script src="assets/site.js?v=20261122233641"></script>
<script src="assets/conceptual-art-projects.js?v=20261122233641"></script>
<script>
const folder = "images/conceptual-art/";
const list = window.PROJECTS || [];
const id = new URLSearchParams(location.search).get("p");
const n = Math.max(0, list.findIndex(p => p.id === id));
const p = list[n];
const root = document.getElementById("piece");
if (!p) {
  location.replace("conceptual-art.html");
} else {
  document.title = (p.title || "Untitled") + " | Manu Conceptual Art";
  const photos = p.photos || [];
  const next = list[(n + 1) % list.length];
  const paras = (p.overview || "").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
  root.innerHTML = `
    <div class="gallery">
      ${photos.length ? `<img class="main" src="${esc(folder + photos[0])}" alt="${esc(p.title || "")}, photo 1">` : ""}
      ${photos.length > 1 ? `<div class="thumbs-row">${photos.map((f, i) =>
        `<button type="button" data-i="${i}" aria-label="Show photo ${i + 1}"${i ? "" : ' aria-current="true"'}><img src="${esc(folder + f)}" alt="" loading="lazy"></button>`).join("")}</div>` : ""}
    </div>
    <div class="words">
      <p class="kicker">${esc(p.medium || "Conceptual Art")} · ${esc(p.year || "")}</p>
      <h1>${esc(p.title || "Untitled")}</h1>
      <div class="say">${paras.map(s => `<p>${esc(s)}</p>`).join("") || `<p style="color:var(--ink-soft)">Words coming soon.</p>`}</div>
      <div class="details">${(p.details || []).map(d => `<span>${esc(d)}</span>`).join("")}</div>
      <nav class="piece-nav">
        <a href="conceptual-art.html#${encodeURIComponent(p.id)}">← All Conceptual Art</a>
        ${next && next !== p ? `<a href="conceptual-project.html?p=${encodeURIComponent(next.id)}">${esc(next.title || "Next")} →</a>` : ""}
      </nav>
    </div>`;
  // Thumbnails swap the big photo.
  const main = root.querySelector(".main");
  root.querySelectorAll(".thumbs-row button").forEach(b => b.addEventListener("click", () => {
    const i = +b.dataset.i;
    main.src = folder + photos[i];
    main.alt = `${p.title || ""}, photo ${i + 1}`;
    root.querySelectorAll(".thumbs-row button").forEach(x => x.setAttribute("aria-current", String(x === b)));
  }));
}
</script>
</body>
</html>
