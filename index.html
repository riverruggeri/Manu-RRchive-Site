<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manu</title>
<meta name="description" content="Manu: River Manu Ruggeri, an artist working in fashion, textiles and photography. Home of the labels ЯRchive (clothing) and ЯRgraphy (photography).">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;800&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20261111222129">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="ЯRchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<style>
  :root { --fallback-bg: #1b1d17; }
  /* The page scrolls: the first screen is the photo, then the about section (River, 2026-11-11) */
  body { background: var(--fallback-bg); }
  #stage, #fallback { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fallback { background: var(--fallback-bg) center / cover no-repeat; transition: background-image 0.3s; }
  /* Photos of a label that slide by while its name is hovered */
  .label-show {
    position: fixed; inset: 0; overflow: hidden; pointer-events: none;
    opacity: 0; transition: opacity 0.7s cubic-bezier(0.4, 0, 0.2, 1);   /* soft fade in and out */
  }
  .label-show.on { opacity: 1; }
  /* Drawn on their own layer so the fade stays smooth on phones */
  .label-show { will-change: opacity; transform: translateZ(0); }
  .label-track { will-change: transform; }
  /* The page's fade-in animation would otherwise block this fade */
  body.photo-page > .label-show.label-show { animation: none !important; }
  .label-show.front { z-index: 1; }
  /* Keep the shading and the words above the photos */
  .shade { z-index: 2; }
  .brand { z-index: 3; }
  .label-track { display: flex; height: 100%; transition: transform 1s linear; }   /* same speed the whole way */
  .label-track img {
    flex: 0 0 100%; width: 100%; height: 100%;
    object-fit: cover; object-position: center 35%; display: block;
    filter: brightness(1.05);
  }
  @media (prefers-reduced-motion: reduce) { .label-track { transition: none; } }
  .shade {
    position: fixed; inset: 0; pointer-events: none;
    background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0.12) 40%, rgba(0,0,0,0) 62%);
  }
  .hero { position: relative; z-index: 3; height: 100vh; height: 100svh; }
  .brand {
    position: absolute; left: 0; right: 0;
    bottom: calc(84px + env(safe-area-inset-bottom, 0px));
    padding-left: max(28px, calc(env(safe-area-inset-left, 0px) + 16px));
    padding-right: max(28px, calc(env(safe-area-inset-right, 0px) + 16px));
    display: flex; flex-direction: column; align-items: flex-start; gap: 14px;
    text-shadow: 0 2px 18px rgba(0,0,0,0.35);
  }
  .wordmark {
    margin: 0; font-weight: 800;
    font-size: clamp(64px, 13vw, 210px);
    line-height: 0.78; letter-spacing: -0.055em; margin-left: -0.04em;
  }
  .line { margin: 0; font-size: clamp(15px, 1.4vw, 18px); color: rgba(231,229,224,0.85); }

  /* The labels: big, each its own thing */
  .labels {
    display: flex; flex-wrap: wrap; gap: 10px clamp(28px, 5vw, 80px);
    margin-top: clamp(14px, 3vh, 34px);
    padding-top: clamp(14px, 2.4vh, 22px);
    border-top: 1px solid rgba(231,229,224,0.35);
    width: 100%;
  }
  .label-link {
    display: flex; flex-direction: column; gap: 10px;
    text-decoration: none; color: var(--ink);
    transition: opacity 0.3s ease, transform 0.3s ease;
  }
  .label-link .name {
    font-weight: 800; font-size: clamp(44px, 7.2vw, 118px);
    line-height: 1.02; letter-spacing: -0.045em;  /* room for the tails of g, p, y */
    display: inline-flex; align-items: baseline; gap: 0.12em;
  }
  .label-link .arrow { font-size: 0.4em; opacity: 0; transform: translateX(-0.3em); transition: opacity 0.25s, transform 0.25s; }
  .label-link:hover .arrow, .label-link.on .arrow { opacity: 1; transform: none; }
  /* Phones: no text selection or link menu while holding a name */
  .label-link { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; -webkit-user-drag: none; }
  .label-link:focus:not(:focus-visible) { outline: none; }
  .label-link .what { font-size: clamp(13px, 1.1vw, 15px); letter-spacing: 0.08em; text-transform: uppercase; color: rgba(231,229,224,0.78); }
  .labels:has(.label-link:hover) .label-link:not(:hover),
  .labels.cycling .label-link:not(.on) { opacity: 0.4; }

  /* Portfolio and About: pill buttons fixed top right, on every part of the page */
  .top-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding-top: calc(18px + env(safe-area-inset-top, 0px)); padding-bottom: 14px;
    padding-left: max(28px, calc(env(safe-area-inset-left, 0px) + 16px));
    padding-right: max(20px, calc(env(safe-area-inset-right, 0px) + 16px));
    transition: background-color 0.35s ease;
  }
  body.scrolled .top-nav { background: color-mix(in srgb, var(--studio) 92%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
  .top-nav .to-top {
    font-weight: 800; font-size: clamp(24px, 2.4vw, 32px); letter-spacing: -0.04em; text-decoration: none;
    opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
  }
  body.scrolled .top-nav .to-top { opacity: 1; pointer-events: auto; }
  .top-nav nav { display: flex; gap: 10px; }
  .pill {
    display: inline-flex; align-items: center; gap: 0.45em;
    font-weight: 600; font-size: 14px; letter-spacing: 0.12em; text-transform: uppercase; text-decoration: none;
    color: var(--ink); border: 1px solid var(--pill-line, rgba(231,229,224,0.75)); border-radius: 999px;
    padding: 10px 20px; background: var(--pill-bg, rgba(20,20,20,0.38));
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    transition: background-color 0.25s, color 0.25s, border-color 0.25s;
  }
  .pill:hover, .pill:focus-visible { background: var(--ink); color: var(--pill-on, #1d1d1b); border-color: var(--ink); }
  .pill.solid { background: var(--ink); color: var(--pill-on, #1d1d1b); border-color: var(--ink); }
  .pill.solid:hover { background: transparent; color: var(--ink); }
  .pill .flip-r { color: inherit; letter-spacing: 0; margin-right: 0.085em; }   /* keeps the Я next to its R in spaced capitals */
  .nowrap { white-space: nowrap; }

  /* "More" arrow at the bottom of the first screen */
  .scroll-cue {
    position: absolute; left: 50%; transform: translateX(-50%); z-index: 3;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; text-decoration: none;
    color: rgba(231,229,224,0.85); text-shadow: 0 1px 8px rgba(0,0,0,0.4);
  }
  .scroll-cue .down { font-size: 18px; animation: nudge 2.2s ease-in-out infinite; }
  @keyframes nudge { 50% { transform: translateY(5px); } }

  /* ---------- Second part: who River is and what they make ---------- */
  :root { --studio: var(--cream); }   /* the site's off-white with dark text (River, 2026-11-11; was grey #4c4c4c) */
  .studio, body.scrolled .top-nav {
    --ink: #141414; --ink-soft: rgba(20,20,20,0.56);
    --pill-line: rgba(20,20,20,0.55); --pill-on: var(--cream); --pill-bg: transparent;
  }
  body.scrolled .top-nav { color: var(--ink); }
  body.scrolled .top-nav .pill { -webkit-backdrop-filter: none; backdrop-filter: none; }
  :root { --line: rgba(20,20,20,0.2); }
  .studio {
    position: relative; z-index: 4; background: var(--studio); color: var(--ink);
    padding-left: max(28px, calc(env(safe-area-inset-left, 0px) + 16px));
    padding-right: max(28px, calc(env(safe-area-inset-right, 0px) + 16px));
    padding-block: clamp(96px, 13vh, 150px) calc(40px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-direction: column; gap: clamp(80px, 12vh, 140px);
  }
  .eyebrow { margin: 0 0 18px; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-soft); }
  .intro {
    display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: clamp(28px, 6vw, 110px); align-items: center;
    max-width: 1400px; width: 100%; margin-inline: auto;
  }
  .intro img { width: 100%; aspect-ratio: 2 / 3; object-fit: cover; display: block; max-height: 82vh; }
  .intro h2 {
    margin: 0 0 26px; font-weight: 800; font-size: clamp(38px, 5.4vw, 88px);
    line-height: 0.95; letter-spacing: -0.045em; text-wrap: balance;
  }
  .intro .text { font-size: clamp(16px, 1.25vw, 19px); line-height: 1.5; max-width: 36em; }
  .intro .text p { margin: 0 0 1em; }
  .buttons { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 26px; }
  .studio .pill { background: transparent; backdrop-filter: none; -webkit-backdrop-filter: none; }
  .studio .pill.solid { background: var(--ink); }
  .studio .pill.solid:hover { background: transparent; }

  .mediums { max-width: 1400px; width: 100%; margin-inline: auto; }
  .mediums > h2 {
    margin: 0 0 clamp(26px, 4vh, 44px); font-weight: 800; font-size: clamp(34px, 4vw, 64px);
    letter-spacing: -0.04em; line-height: 1;
  }
  .medium-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(18px, 2.4vw, 36px); }
  .medium { display: flex; flex-direction: column; gap: 14px; border-top: 1px solid var(--line); padding-top: 18px; }
  .medium .num { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; color: var(--ink-soft); }
  .medium .pic { display: block; overflow: hidden; aspect-ratio: 4 / 5; background: var(--cream-deep); }
  .medium .pic img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.8s cubic-bezier(0.2, 0.7, 0.2, 1); }
  .medium .pic:hover img { transform: scale(1.04); }
  .medium h3 { margin: 6px 0 0; font-size: clamp(22px, 2vw, 30px); font-weight: 800; letter-spacing: -0.03em; }
  .medium p { margin: 0; font-size: 16px; line-height: 1.5; max-width: 34em; }
  .medium .buttons { margin-top: 4px; }
  .medium .pill { font-size: 13px; padding: 9px 16px; }

  /* Big Portfolio / About links at the end */
  .big-links { max-width: 1400px; width: 100%; margin-inline: auto; display: grid; }
  .big-links a {
    display: flex; justify-content: space-between; align-items: baseline; gap: 16px;
    padding-block: clamp(14px, 2.4vh, 26px); border-top: 1px solid var(--line);
    text-decoration: none; font-weight: 800; font-size: clamp(44px, 8vw, 132px);
    letter-spacing: -0.05em; line-height: 0.95; transition: padding 0.3s ease, color 0.3s;
  }
  .big-links a:last-child { border-bottom: 1px solid var(--line); }
  .big-links a small { font-size: clamp(13px, 1.1vw, 16px); font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
  .big-links a:hover { padding-left: 0.25em; }
  .foot { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 10px; font-size: 14px; color: var(--ink-soft); max-width: 1400px; width: 100%; margin: -60px auto 0; }
  .foot a { text-decoration: none; color: var(--ink); }

  .manu-word { display: none; }
  @media (max-width: 700px) {
    .brand { bottom: calc(48px + env(safe-area-inset-bottom, 0px)); gap: 10px; }
    .labels { flex-direction: column; gap: 18px; }
    .label-link .name { font-size: clamp(46px, 15vw, 72px); }
    .label-link .arrow { opacity: 1; transform: none; }
    .brand { bottom: calc(64px + env(safe-area-inset-bottom, 0px)); }
    .scroll-cue .word { display: none; }
    .pill { font-size: 12px; padding: 9px 14px; letter-spacing: 0.1em; }
    .top-nav { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
    .top-nav nav { gap: 8px; }
  }
  @media (max-width: 900px) {
    .intro { grid-template-columns: 1fr; }
    .intro img { max-height: none; }
    .medium-list { grid-template-columns: 1fr; gap: 56px; }
    .medium .pic { aspect-ratio: 4 / 4.4; }
    .foot { margin-top: -40px; }
    .big-links a { flex-direction: column; align-items: flex-start; gap: 8px; }
  }
</style>
</head>
<body class="photo-page" data-no-menu>
<canvas id="stage" aria-hidden="true"></canvas>
<div id="fallback" hidden></div>
<div class="label-show" aria-hidden="true"><div class="label-track"></div></div>
<div class="label-show" aria-hidden="true"><div class="label-track"></div></div>
<div class="shade" aria-hidden="true"></div>

<header class="top-nav">
  <a class="to-top" href="#top" aria-label="Back to the top">Manu</a>
  <nav aria-label="Main">
    <a class="pill" href="portfolio.html">Portfolio</a>
    <a class="pill" href="about.html">About</a>
  </nav>
</header>

<section class="hero" id="top">
  <div class="brand">
    <h1 class="wordmark">MANU</h1>
    <p class="line">Artist working in fashion, textiles and photography.</p>
    <nav class="labels" id="labels" aria-label="Labels"></nav>
  </div>
  <a class="scroll-cue" href="#studio"><span class="word">About Manu</span><span class="down" aria-hidden="true">↓</span></a>
</section>
<div class="corner left" data-clock aria-label="Current time"></div>
<a class="corner right" id="insta" target="_blank" rel="noopener"></a>

<main class="studio" id="studio"></main>

<script src="assets/site.js?v=20261111222129"></script>
<script src="assets/ripple.js?v=20261111222129"></script>
<script>
/* =========================================================
   PAGE SETTINGS
   Each label gets a big name and a short caption. Hovering a name
   shows that label's photos sliding by (listed in assets/site.js,
   labels → slides); on phones the labels take turns. Each label
   carries on from the photo it was last on, and ЯRchive opens on the
   same photo. A new label is one more entry in "labels".
   ========================================================= */
const PAGE = {
  hoverPhotos: true,   // false = names only, no photos
  slideSeconds: 3.6,   // how long each photo stays while hovering
  labels: [
    { key: "rrchive",  name: "ЯRchive",  what: "Clothing · one-of-one pieces",   link: "shop.html" },
    { key: "rrgraphy", name: "ЯRgraphy", what: "Photography · commissions open", link: "rrgraphy.html" }
  ],
  // The part you scroll down to. River's photo, a short intro, then each medium.
  about: {
    photo: "images/home/river.jpg",
    eyebrow: "About",
    title: "River Manu Ruggeri",
    text: `I’m an artist based in Florida whose work focuses on fashion, textiles, and photography. A large part of my process involves transforming used or discarded garments into new pieces through reconstruction, distressing, fabric manipulation, and experimentation with texture and material.

I aim to create work that feels raw, intentional, and honest rather than overly polished or perfect.`
  },
  mediumsTitle: "What I make",
  mediums: [
    { title: "Fashion & Textiles", photo: "images/home/fashion.jpg", link: "fashion-works.html",
      text: "Used and discarded garments taken apart and rebuilt through reconstruction, distressing and fabric manipulation. One-of-one pieces are available through ЯRchive.",
      buttons: [{ label: "ЯRchive", link: "shop.html", solid: true }, { label: "Experimental Fashion", link: "fashion-works.html" }] },
    { title: "Photography", photo: "images/home/photography.jpg", link: "photography.html",
      text: "Fashion, portrait and object photography built around atmosphere, emotion and feeling. Shoots and commissions through ЯRgraphy.",
      buttons: [{ label: "ЯRgraphy", link: "rrgraphy.html", solid: true }, { label: "Photography", link: "photography.html" }] },
    { title: "Conceptual Art", photo: "images/home/conceptual.jpg", link: "conceptual-art.html",
      text: "Projects that take clothing past wearing, where denim, layering and form become the idea itself.",
      buttons: [{ label: "View projects", link: "conceptual-art.html" }] }
  ],
  bigLinks: [
    { label: "Portfolio", note: "Fashion · Photography · Art", link: "portfolio.html" },
    { label: "About", note: "Bio · Contact · Services", link: "about.html" }
  ],
  background: "images/home-bg.jpg",
  mobileBackground: "images/about/about-hero.jpg",
  ripple: { distortionX: 2, distortionY: 2, scale: 4.3, speed: 4, direction: 270,
            mouseInteraction: true, mouseSensitivity: 50, brightness: 1.15, phoneStrength: 2.2, phoneAutoMotion: true }
};
const nav = document.getElementById("labels");
nav.innerHTML = PAGE.labels.map((l, i) =>
  `<a class="label-link" data-i="${i}" href="${esc(l.link)}"><span class="name"><span>${brandHTML(l.name)}</span><span class="arrow">→</span></span><span class="what">${esc(l.what)}</span></a>`).join("");
// Fill in the part you scroll down to
const A = PAGE.about;
// Keep a flipped-R name together on one line
const brandWord = t => brandHTML(t).replace(/(<span class="flip-r">R<\/span>[^\s<]*)/g, '<span class="nowrap">$1</span>');
const pills = list => `<div class="buttons">${list.map(b =>
  `<a class="pill${b.solid ? " solid" : ""}" href="${esc(b.link)}"><span>${brandHTML(b.label)}</span><span aria-hidden="true">→</span></a>`).join("")}</div>`;
document.getElementById("studio").innerHTML = `
  <div class="intro">
    <img src="${esc(A.photo)}" alt="River Manu Ruggeri wearing a reworked denim piece" loading="lazy">
    <div>
      <p class="eyebrow">${esc(A.eyebrow)}</p>
      <h2>${esc(A.title)}</h2>
      <div class="text">${A.text.split(/\n\s*\n/).map(p => `<p>${esc(p.trim())}</p>`).join("")}</div>
      ${pills([{ label: "More about me", link: "about.html", solid: true }, { label: "Portfolio", link: "portfolio.html" }])}
    </div>
  </div>
  <section class="mediums">
    <h2>${esc(PAGE.mediumsTitle)}</h2>
    <div class="medium-list">${PAGE.mediums.map((m, i) => `
      <article class="medium">
        <span class="num">0${i + 1}</span>
        <a class="pic" href="${esc(m.link)}" aria-label="${esc(m.title)}"><img src="${esc(m.photo)}" alt="" loading="lazy"></a>
        <h3>${esc(m.title)}</h3>
        <p>${brandWord(m.text)}</p>
        ${pills(m.buttons)}
      </article>`).join("")}
    </div>
  </section>
  <nav class="big-links" aria-label="Portfolio and About">${PAGE.bigLinks.map(b =>
    `<a href="${esc(b.link)}"><span>${esc(b.label)} →</span><small>${esc(b.note)}</small></a>`).join("")}
  </nav>
  <footer class="foot"><span>© ${new Date().getFullYear()} River Manu Ruggeri</span>
    <a href="https://www.instagram.com/${esc(SITE.contact.instagram)}/" target="_blank" rel="noopener">@${esc(SITE.contact.instagram)}</a></footer>`;

// Once you scroll past the first screen: the top bar gets a background,
// and the ripple pauses while it's covered.
const heroEl = document.getElementById("top"), stageEl = document.getElementById("stage");
function onScroll() {
  const y = scrollY, h = heroEl.offsetHeight;
  document.body.classList.toggle("scrolled", y > h * 0.75);
  if (y >= h) stageEl.dataset.away = "1"; else delete stageEl.dataset.away;
}
addEventListener("scroll", onScroll, { passive: true }); onScroll();
document.querySelector(".scroll-cue").addEventListener("click", e => {
  e.preventDefault(); document.getElementById("studio").scrollIntoView({ behavior: "smooth" });
});
document.querySelector(".to-top").addEventListener("click", e => {
  e.preventDefault(); scrollTo({ top: 0, behavior: "smooth" });
});

const insta = document.getElementById("insta");
insta.href = `https://www.instagram.com/${SITE.contact.instagram}/`;
insta.textContent = "@" + SITE.contact.instagram;

startRipple({ canvas: document.getElementById("stage"), fallback: document.getElementById("fallback"),
  image: PAGE.background, tallImage: PAGE.mobileBackground, ripple: PAGE.ripple });

if (PAGE.hoverPhotos) {
  // Two photo layers: going from one label to the other, the new photos
  // fade in over the old ones, so the homepage never shows in between.
  const layers = [...document.querySelectorAll(".label-show")].map(el => ({ el, track: el.firstElementChild, label: null, shape: "", slider: null }));
  const links = [...nav.querySelectorAll(".label-link")];
  let front = null, timer, closing, holdRipple;
  const stage = document.getElementById("stage");
  const photosOf = l => (SITE.labels[l.key] && SITE.labels[l.key].slides || {})[slideShape()] || [];
  // Load the first few photos of each label ahead so they appear quickly.
  PAGE.labels.forEach(l => {
    const list = photosOf(l), i = slidePlace.get(l.key, slideShape());
    [i, i + 1, i + 2].forEach(k => list.length && (new Image().src = list[k % list.length]));
  });
  // On computers, load every photo of both labels once the page has settled,
  // so each one is ready in time and both labels change at the same pace.
  if (matchMedia("(hover: hover)").matches) addEventListener("load", () => setTimeout(() =>
    PAGE.labels.forEach(l => photosOf(l).forEach(src => { new Image().src = src; })), 800));
  const ready = img => !img || img.complete ? Promise.resolve()
    : (img.decode ? img.decode() : Promise.resolve()).catch(() => {});

  // Show a label's photos from where they last stopped.
  function open(l, slide) {
    clearInterval(timer); clearTimeout(closing);
    const list = photosOf(l);
    if (!list.length) return close();
    // Use the layer already showing this label, otherwise the other one.
    let layer = layers.find(x => x.label === l && x.shape === slideShape());
    if (!layer) {
      layer = layers.find(x => x !== front) || layers[0];
      layer.label = l; layer.shape = slideShape();
      layer.slider = makeSlider(layer.track, list, slidePlace.get(l.key, layer.shape), i => slidePlace.set(l.key, layer.shape, i));
    }
    // Hovering picks up on the photo it stopped on; phones show the next one each turn.
    if (!slide) layer.slider.jump(layer.slider.at + 1);
    const old = front;
    front = layer;
    layers.forEach(x => x.el.classList.toggle("front", x === layer));
    ready(layer.track.children[layer.slider.at]).then(() => {
      if (front !== layer) return;
      layer.el.classList.add("on");
      // Once the photos fully cover the homepage, pause the ripple under them.
      clearTimeout(holdRipple);
      holdRipple = setTimeout(() => { if (front === layer) stage.dataset.hold = "1"; }, 800);
      // Once the new photos have faded in on top, quietly hide the old ones.
      if (old && old !== layer) setTimeout(() => { if (front === layer) old.el.classList.remove("on"); }, 750);
    });
    if (slide) timer = setInterval(() => layer.slider.next(), PAGE.slideSeconds * 1000);
  }
  function close() {
    clearInterval(timer);
    clearTimeout(holdRipple); delete stage.dataset.hold;
    layers.forEach(x => x.el.classList.remove("on"));
    front = null;
  }

  // "?phone" in the address makes a computer act like a phone (for the
  // iPhone preview): press and hold with the mouse instead of hovering.
  const phoneTest = /[?&]phone\b/.test(location.search);
  if (matchMedia("(hover: hover)").matches && !phoneTest) {
    links.forEach(a => a.addEventListener("mouseenter", () => open(PAGE.labels[a.dataset.i], true)));
    // A short pause before fading back to the homepage, so passing
    // between the two names never shows it.
    nav.addEventListener("mouseleave", () => { clearTimeout(closing); closing = setTimeout(close, 180); });
  } else {
    // Phones: the homepage stays still. Press and hold a name to bring up
    // its photos (they start sliding); let go to fade back. A quick tap
    // still opens the label.
    // The iPhone's own press-and-hold (link preview / dragging the link)
    // is switched off by taking over the touch; a quick tap still opens it.
    let holdTimer, held = false, moved = false, x0 = 0, y0 = 0, yLast = 0;
    links.forEach(a => {
      const l = PAGE.labels[a.dataset.i];
      a.setAttribute("draggable", "false");
      a.addEventListener("touchstart", e => {
        e.preventDefault();
        held = false; moved = false;
        x0 = e.touches[0].clientX; y0 = yLast = e.touches[0].clientY;
        clearTimeout(holdTimer);
        holdTimer = setTimeout(() => {
          held = true;
          nav.classList.add("cycling");
          links.forEach(x => x.classList.toggle("on", x === a));
          open(l, true);
        }, 350);
      }, { passive: false });
      a.addEventListener("touchmove", e => {
        const t = e.touches[0];
        if (Math.hypot(t.clientX - x0, t.clientY - y0) > 10) { moved = true; if (!held) clearTimeout(holdTimer); }
        // The touch was taken over, so move the page by hand when swiping on a name.
        if (moved && !held) scrollBy(0, yLast - t.clientY);
        yLast = t.clientY;
      }, { passive: true });
      a.addEventListener("touchend", e => {
        e.preventDefault();
        clearTimeout(holdTimer);
        if (held) {
          close(); nav.classList.remove("cycling"); links.forEach(x => x.classList.remove("on"));
          held = false;
        } else if (!moved) {
          a.click();   // quick tap: open the label
        } else if (yLast - y0 < -40 && scrollY < innerHeight) {
          // A swipe up on a name glides on down to the about section.
          document.getElementById("studio").scrollIntoView({ behavior: "smooth" });
        }
      }, { passive: false });
      a.addEventListener("touchcancel", () => {
        clearTimeout(holdTimer);
        if (held) { close(); nav.classList.remove("cycling"); links.forEach(x => x.classList.remove("on")); held = false; }
      });
      a.addEventListener("contextmenu", e => e.preventDefault());
      if (phoneTest) {
        // Mouse stand-in for a finger: hold the button down on a name.
        a.addEventListener("mousedown", e => {
          e.preventDefault(); held = false; moved = false;
          clearTimeout(holdTimer);
          holdTimer = setTimeout(() => { held = true; open(l, true); }, 350);
        });
        const up = () => { clearTimeout(holdTimer); if (held) { close(); setTimeout(() => { held = false; }, 0); } };
        a.addEventListener("mouseup", up);
        a.addEventListener("mouseleave", up);
        a.addEventListener("click", e => { if (held) e.preventDefault(); });
      }
    });
  }
}
</script>
</body>
</html>
