<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Start a Commission</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;800&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20261111033940">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="ЯRchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e7e5e0">
<style>
  /* Layout: same dark sheet as Commissions; one narrow column with the request form */
  :root {
    --page: var(--cream);    /* old dark: #0c0c0c */
    --sheet: var(--cream);   /* old dark: #222222 */
    --bar: var(--sheet);
    --field: var(--cream-light);
    --field-line: rgba(20, 20, 20, 0.2);
    --ok: #2e7a3c;
    --warn: #a63a22;
  }
  html { background: var(--page); }
  body { background: var(--page); color: var(--ink); }
  .sheet {
    max-width: 1280px;
    min-height: 100vh;
    margin: 0 auto;
    background: var(--sheet);
    box-sizing: border-box;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: clamp(80px, 10vw, 110px) 90px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  .back { display: inline-block; font-size: 14px; color: var(--ink-soft); text-decoration: none; margin-bottom: 22px; }
  .back:hover { color: var(--ink); }
  h1 {
    margin: 0 0 12px;
    font-weight: 800;
    font-size: clamp(38px, 5vw, 60px);
    line-height: 0.95;
    letter-spacing: -0.03em;
  }
  .lead { margin: 0 0 28px; font-size: 16px; line-height: 1.4; color: var(--ink-soft); max-width: 56ch; }

  form { display: grid; gap: 16px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { display: grid; gap: 6px; font-size: 13px; }
  label .hint { color: var(--ink-soft); font-size: 12px; }
  input, select, textarea {
    font: inherit; font-size: 15px;
    color: var(--ink);
    background: var(--field);
    border: 1px solid var(--field-line);
    border-radius: 4px;
    padding: 10px 11px;
    width: 100%;
    box-sizing: border-box;
    min-width: 0;
  }
  textarea { min-height: 130px; resize: vertical; line-height: 1.4; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--ink); outline-offset: 1px; border-color: transparent; }
  .send {
    justify-self: start;
    background: #141414; color: var(--cream); border: 0; border-radius: 4px;
    padding: 12px 18px; font: inherit; font-weight: 800; font-size: 16px; cursor: pointer;
  }
  .send:hover { background: #2b2b2b; }
  .send:disabled { opacity: 0.6; cursor: default; }
  .status { margin: 0; font-size: 14px; line-height: 1.45; }
  .status.ok { color: var(--ok); }
  .status.warn { color: var(--warn); }
  .direct { margin-top: 26px; font-size: 14px; color: var(--ink-soft); line-height: 1.5; }
  .direct strong { color: var(--ink); font-weight: 600; user-select: all; }
  .copy-btn {
    background: none; border: 1px solid var(--field-line); color: var(--ink);
    font: inherit; font-size: 12px; padding: 3px 8px; border-radius: 3px; cursor: pointer; margin-left: 6px;
  }
  @media (max-width: 560px) { .row { grid-template-columns: 1fr; } }
  @media (max-width: 900px) { html:not([data-section="manu"]) .sheet { padding-top: 124px; } }
  /* iPhone: 16px stops Safari zooming in when you tap a field */
  @media (max-width: 700px), (hover: none) { input, select, textarea { font-size: 16px; } }
</style>
</head>
<body class="long light">

<div class="sheet">
  <div class="wrap">
    <a class="back" id="back" href="commissions.html">← Commissions</a>
    <h1 id="title">START A COMMISSION</h1>
    <p class="lead" id="lead"></p>
        <form id="form" novalidate>
          <div class="row">
            <label for="f-name">Name<input id="f-name" name="name" autocomplete="name" required></label>
            <label for="f-email">Email<input id="f-email" name="email" type="email" autocomplete="email" required></label>
          </div>
          <label for="f-service"><span id="serviceLabel">What kind of piece?</span><select id="f-service" name="service"></select></label>
          <label for="f-idea">Your idea
            <span class="hint" id="ideaHint"></span>
            <textarea id="f-idea" name="idea" required></textarea>
          </label>
          <label for="f-refs">References
            <span class="hint">Links to photos, Pinterest boards or Instagram posts.</span>
            <input id="f-refs" name="references">
          </label>
          <div class="row">
            <label for="f-size" class="clothing-only">Size or measurements<input id="f-size" name="size"></label>
            <label for="f-location" class="photo-only" hidden>Location<input id="f-location" name="location"></label>
            <label for="f-budget">Budget<input id="f-budget" name="budget" inputmode="decimal"></label>
          </div>
          <div class="row">
            <label for="f-when"><span id="whenLabel">Needed by</span><input id="f-when" name="needed_by" type="date"></label>
            <label for="f-where" class="clothing-only">Shipping or local pickup?
              <select id="f-where" name="delivery">
                <option>Ship it to me</option>
                <option>Local pickup</option>
                <option>Not sure yet</option>
              </select>
            </label>
          </div>
          <button class="send" type="submit" id="send">Send request</button>
          <p class="status" id="status" role="status"></p>
        </form>
        <p class="direct">Prefer email? Write to <strong id="email"></strong><button class="copy-btn" type="button" id="copyEmail">Copy</button></p>
  </div>
</div>

<div class="corner left" data-clock aria-label="Current time"></div>
<a class="corner right" href="index.html" data-section-name>Manu</a>

<script src="assets/site.js?v=20261111033940"></script>
<script>
/* =========================================================
   PAGE SETTINGS
   ========================================================= */
const PAGE = {
  // This one form handles both kinds of commission. Links ending in
  // ?type=photo open the photography version.
  types: {
    clothing: {
      back: { label: "Commissions", link: "commissions.html" },
      lead: "Tell me about the piece you have in mind. I'll reply by email to settle the details and send a quote.",
      serviceLabel: "What kind of piece?",
      ideaHint: "What you'd like made or changed, the look you're after, and any garments you already have.",
      whenLabel: "Needed by",
      subject: "Commission request",
      // keep these the same as the services on commissions.html
      services: ["Repair / Reimagine Garments", "Custom Garment Commissions", "Custom Textile Commissions"]
    },
    photo: {
      back: { label: "Photography Commissions", link: "photo-commissions.html" },
      lead: "Tell me about the shoot you have in mind. I'll reply by email to settle the details and send a quote.",
      serviceLabel: "What kind of shoot?",
      ideaHint: "What the photos are for, the look and mood you're after, and who or what is in them.",
      whenLabel: "Preferred date",
      subject: "Photography commission request",
      // keep these the same as the services on photo-commissions.html
      services: ["Portrait Photography", "Fashion / Lookbook Photography", "Object / Product Photography"]
    }
  },

  // Where requests go. Leave "" to have the form open the visitor's
  // email app with everything filled in. To get requests straight to
  // your inbox instead, make a free form at formspree.io and paste its
  // address here, e.g. "https://formspree.io/f/abcd1234".
  formEndpoint: ""
};

const kind = /type=photo/.test(location.search) ? "photo" : "clothing";
const T = PAGE.types[kind];
const back = document.getElementById("back");
back.href = T.back.link; back.textContent = "← " + T.back.label;
document.getElementById("lead").textContent = T.lead;
document.getElementById("serviceLabel").textContent = T.serviceLabel;
document.getElementById("ideaHint").textContent = T.ideaHint;
document.getElementById("whenLabel").textContent = T.whenLabel;
// Fields that don't apply are hidden and left out of the request.
const toggle = (sel, show) => document.querySelectorAll(sel).forEach(el => {
  el.hidden = !show;
  el.querySelectorAll("input, select, textarea").forEach(f => f.disabled = !show);
});
toggle(".clothing-only", kind === "clothing");
toggle(".photo-only", kind === "photo");
if (kind === "photo") document.title = "Start a Photography Commission";
document.getElementById("f-service").innerHTML = T.services
  .map(s => `<option>${esc(s)}</option>`).join("") + "<option>Something else</option>";

// Coming from a "Start a commission" link that names a service picks it.
const pick = new URLSearchParams(location.search).get("service");
if (pick) [...document.getElementById("f-service").options].forEach(o => { if (o.text === pick) o.selected = true; });

const email = SITE.contact.email;
document.getElementById("email").textContent = email;
document.getElementById("copyEmail").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(email); showToast("Email address copied"); }
  catch { const r = document.createRange(); r.selectNodeContents(document.getElementById("email")); getSelection().removeAllRanges(); getSelection().addRange(r); }
});

/* ---------- Form ---------- */
const form = document.getElementById("form");
const status = document.getElementById("status");
const send = document.getElementById("send");
const fieldNames = {
  name: "Name", email: "Email", service: "Piece", idea: "Idea", references: "References",
  size: "Size or measurements", location: "Location", budget: "Budget", needed_by: "Date", delivery: "Delivery"
};

form.addEventListener("submit", async e => {
  e.preventDefault();
  status.className = "status";
  const data = Object.fromEntries(new FormData(form));
  const missing = [];
  if (!data.name.trim()) missing.push("your name");
  if (!/^\S+@\S+\.\S+$/.test(data.email.trim())) missing.push("an email address I can reply to");
  if (!data.idea.trim()) missing.push("a short description of your idea");
  if (missing.length) {
    status.classList.add("warn");
    status.textContent = "Please add " + missing.join(", ") + ".";
    return;
  }

  if (!PAGE.formEndpoint) {
    // No form service yet: open the visitor's email app with the request written out.
    const body = Object.entries(data).filter(([, v]) => String(v).trim())
      .map(([k, v]) => `${fieldNames[k] || k}: ${v}`).join("\n");
    const subject = `${T.subject}: ${data.service}`;
    location.href = `mailto:${email}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    status.textContent = "Your email app should open with the request filled in. If it doesn't, email " + email + " directly.";
    return;
  }

  send.disabled = true;
  send.textContent = "Sending…";
  try {
    const res = await fetch(PAGE.formEndpoint, {
      method: "POST",
      headers: { "Accept": "application/json", "Content-Type": "application/json" },
      body: JSON.stringify({ ...data, _subject: `${T.subject}: ${data.service}` })
    });
    if (!res.ok) throw new Error(res.status);
    form.reset();
    status.classList.add("ok");
    status.textContent = "Request sent. I'll reply by email.";
  } catch {
    status.classList.add("warn");
    status.textContent = "The request didn't go through. Please try again, or email " + email + " directly.";
  } finally {
    send.disabled = false;
    send.textContent = "Send request";
  }
});
</script>
</body>
</html>
