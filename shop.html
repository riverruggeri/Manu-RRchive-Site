<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Current Catalog</title>
<meta name="description" content="One-of-one pieces by Manu / ЯRchive, reworked from what already exists.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;800&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20261111033424">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="ЯRchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#e7e5e0">
<link rel="stylesheet" href="assets/shop.css?v=20261111033424">
</head>
<body class="shop long over-hero">

<!-- Full-screen opening: big ЯRchive logo over a slideshow of the pieces -->
<section class="hero" id="hero" aria-label="ЯRchive">
  <div class="hero-track" id="heroTrack"></div>
  <div class="hero-shade" aria-hidden="true"></div>
  <a class="hero-logo" id="heroLogo" href="archive.html" aria-label="ЯRchive, see the Archive"><span class="logo-mark" aria-hidden="true"></span></a>
  <div class="hero-dots" id="heroDots" aria-hidden="true"></div>
  <a class="hero-down label" href="#catalog">Current Catalog <span aria-hidden="true">↓</span></a>
</section>

<main class="shop-page" id="catalog">
  <header class="catalog-head">
    <h1>Current<br>Catalog</h1>
    <p class="note label soft" id="note"></p>
  </header>
  <div id="rails"></div>
  <p class="to-archive label"><a href="archive.html">See past pieces in the Archive →</a></p>
</main>

<script src="assets/site.js?v=20261111033424"></script>
<script src="assets/catalog.js?v=20261111033424"></script>
<script>
const PAGE = {
  // Full-screen slideshow at the top. The photos are listed in
  // assets/site.js (labels → rrchive → slides), shared with the Manu
  // homepage so the slideshow opens on the photo you saw there.
  hero: { seconds: 4.5 },   // how long each photo stays
  // The rows of the shop, top to bottom. Each piece goes in the row
  // named by its "category" in assets/catalog.js. "empty" is shown
  // when a row has nothing in it yet.
  rows: [
    { category: "bottoms",     title: "Bottoms",     empty: "More coming soon" },
    { category: "tops",        title: "Tops",        empty: "More coming soon" },
    { category: "accessories", title: "Accessories", empty: "More coming soon" }
  ],
  note: "One-of-one pieces, reworked from what already exists. Each piece is made once; when it sells, it's gone.",
  emptyText: "Nothing in the catalog right now. New pieces are on the way."
};

const statusText = { available: "1 of 1", reserved: "Reserved", sold: "Sold" };
const priceOf = p => p.status === "sold" ? "Sold" : (p.price || "Price on request");
const img = name => "images/shop/" + name;

const avail = CATALOG.filter(p => p.status !== "sold");
const sold = CATALOG.filter(p => p.status === "sold");
document.getElementById("note").textContent =
  `${avail.length} ${avail.length === 1 ? "piece" : "pieces"} available. ${PAGE.note}`;

function card(p) {
  const [a, b] = p.photos || [];
  return `<a class="piece${p.status === "sold" ? " sold" : ""}" href="product.html?piece=${encodeURIComponent(p.id)}">
    <div class="pic">
      ${a ? `<img class="main" src="${esc(img(a))}" alt="${esc(p.name)}" loading="lazy">` : ""}
      ${b ? `<img class="alt" src="${esc(img(b))}" alt="" loading="lazy">` : ""}
    </div>
    <div class="meta label">
      <span class="name">${esc(p.name)}</span>
      <span class="soft">${esc(priceOf(p))}</span>
      <span class="tag soft">${esc(statusText[p.status] || "")}</span>
    </div>
  </a>`;
}
const rows = PAGE.rows.map(r => ({ ...r, items: avail.filter(p => p.category === r.category) }));
// Pieces without a known row still show, in an extra row at the end.
const known = PAGE.rows.map(r => r.category);
const other = avail.filter(p => !known.includes(p.category));
if (other.length) rows.push({ title: "More", items: other });

document.getElementById("rails").innerHTML = rows.map((r, i) => `
  <section class="rail-block">
    <header class="rail-head">
      <h2>${esc(r.title)} <span class="soft">${r.items.length || ""}</span></h2>
      <div class="rail-arrows">
        <button type="button" class="rail-arrow" data-rail="${i}" data-dir="-1" aria-label="Scroll ${esc(r.title)} left">←</button>
        <button type="button" class="rail-arrow" data-rail="${i}" data-dir="1" aria-label="Scroll ${esc(r.title)} right">→</button>
      </div>
    </header>
    <div class="rail" id="rail-${i}">
      ${r.items.length ? r.items.map(card).join("") :
        `<div class="piece coming"><div class="pic"><span class="label soft">${esc(r.empty || "More coming soon")}</span></div></div>`}
    </div>
  </section>`).join("");

// Arrows: slide one card at a time; hide them when a row doesn't overflow.
document.querySelectorAll(".rail").forEach((rail, i) => {
  const arrows = document.querySelectorAll(`.rail-arrow[data-rail="${i}"]`);
  const sync = () => {
    const max = rail.scrollWidth - rail.clientWidth;
    arrows.forEach(a => { a.hidden = max < 4; });
    if (max >= 4) {
      arrows[0].disabled = rail.scrollLeft < 4;
      arrows[1].disabled = rail.scrollLeft > max - 4;
    }
  };
  arrows.forEach(a => a.addEventListener("click", () => {
    const step = (rail.querySelector(".piece")?.offsetWidth || 260) + 24;
    rail.scrollBy({ left: step * Number(a.dataset.dir), behavior: "smooth" });
  }));
  rail.addEventListener("scroll", sync, { passive: true });
  addEventListener("resize", sync);
  sync();
});

/* ---------- Opening slideshow ---------- */
(() => {
  const hero = document.getElementById("hero"), track = document.getElementById("heroTrack");
  const dotsEl = document.getElementById("heroDots");
  const logoUrl = new URL("images/rrchive-logo.png", location.href).href;
  document.getElementById("heroLogo").style.setProperty("--logo", `url("${logoUrl}")`);
  const SLIDES = SITE.labels.rrchive.slides;
  let slider = null, timer, shape = "";
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  function build() {
    const next = slideShape();
    if (next === shape) return;
    shape = next;
    const list = SLIDES[shape];
    dotsEl.innerHTML = list.map(() => "<span></span>").join("");
    slider = makeSlider(track, list, slidePlace.get("rrchive", shape), i => {
      slidePlace.set("rrchive", shape, i);
      [...dotsEl.children].forEach((d, k) => d.classList.toggle("on", k === i));
      restart();
    });
    slider.jump(slider.at);
  }
  // It only moves on while you can see it: scrolled down to the clothes,
  // or on another page or tab, it waits on the same photo.
  let visible = true;
  function restart() {
    clearTimeout(timer);
    if (!reduce && visible && !document.hidden) timer = setTimeout(() => { track.classList.add("auto"); slider.next(); }, PAGE.hero.seconds * 1000);
  }
  new IntersectionObserver(([e]) => { visible = e.isIntersecting; restart(); }).observe(hero);
  document.addEventListener("visibilitychange", restart);
  // Swipe on phones
  let x0 = null;
  hero.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive: true });
  hero.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0; x0 = null;
    if (Math.abs(dx) > 40) { track.classList.remove("auto"); dx < 0 ? slider.next() : slider.prev(); }
  });
  // Click (or tap) the left or right side of the screen to go back or forward.
  hero.addEventListener("click", e => {
    if (e.target.closest("a, button")) return;
    const x = e.clientX / innerWidth;
    if (x < 0.35 || x > 0.65) track.classList.remove("auto");
    if (x < 0.35) slider.prev(); else if (x > 0.65) slider.next();
  });
  hero.addEventListener("mousemove", e => {
    if (e.target.closest("a, button")) { hero.style.cursor = ""; return; }
    const x = e.clientX / innerWidth;
    hero.style.cursor = x < 0.35 ? "w-resize" : x > 0.65 ? "e-resize" : "";
  });
  addEventListener("resize", build);
  build();

  // While the opening is on screen, the header is drawn in cream over the photos.
  // It switches back the moment the bottom of the photos passes the
  // middle of the header (logo, MANU and the dots).
  const headerLine = () => {
    const el = document.querySelector(".to-manu") || document.querySelector(".menu-btn");
    if (!el) return 40;
    const r = el.getBoundingClientRect();
    return r.top + r.height / 2;
  };
  let line = headerLine(), queued = false;
  const check = () => {
    queued = false;
    document.body.classList.toggle("over-hero", hero.getBoundingClientRect().bottom > line);
  };
  addEventListener("scroll", () => { if (!queued) { queued = true; requestAnimationFrame(check); } }, { passive: true });
  addEventListener("resize", () => { line = headerLine(); check(); });
  check();

  // "Current Catalog ↓": glide down to the clothes
  document.querySelector(".hero-down").addEventListener("click", e => {
    e.preventDefault();
    document.getElementById("catalog").scrollIntoView({ behavior: reduce ? "auto" : "smooth" });
  });
})();

/* ---------- Where the page opens ----------
   Coming back from one of the pieces returns you to where you were in
   the catalog; arriving any other way (from Manu, the menu, a link)
   always starts at the top with the slideshow. */
(() => {
  try { history.scrollRestoration = "manual"; } catch (e) {}
  const KEY = "rrchive-shop-return";
  document.addEventListener("click", e => {
    if (e.target.closest("a.piece")) {
      try { sessionStorage.setItem(KEY, String(scrollY)); } catch (err) {}
    }
  });
  const place = () => {
    let y = null;
    try { y = sessionStorage.getItem(KEY); sessionStorage.removeItem(KEY); } catch (err) {}
    const cameBack = y !== null && /product\.html/.test(document.referrer || "") || (y !== null && performance.getEntriesByType?.("navigation")[0]?.type === "back_forward");
    const target = cameBack ? Number(y) : 0;
    // Set it now, and again once everything has loaded, in case the
    // browser tries to put back the old position afterwards.
    const go = () => scrollTo(0, target);
    go(); requestAnimationFrame(go);
    if (document.readyState !== "complete") addEventListener("load", () => { go(); setTimeout(go, 60); }, { once: true });
    else setTimeout(go, 60);
  };
  place();
  addEventListener("pageshow", e => { if (e.persisted) place(); });
})();
</script>
</body>
</html>
