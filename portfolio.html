<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manu Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;800&display=swap">
<link rel="stylesheet" href="assets/site.css?v=20261111011631">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<meta name="apple-mobile-web-app-title" content="ЯRchive">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<style>
  /* Layout: full-bleed rippling photo, desktop icons centered, clock and name in the bottom corners */
  :root { --fallback-bg: #1b1d17; --icon: clamp(70px, 7.4vw, 112px); }
  html, body { height: 100%; }
  body { overflow: hidden; background: var(--fallback-bg); }

  #stage, #fallback { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fallback { background: var(--fallback-bg) center / cover no-repeat; }

  .desktop {
    position: fixed; inset: 0;
    display: grid; place-items: center;
    pointer-events: none;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .icons {
    display: flex; flex-wrap: wrap; justify-content: center;
    gap: clamp(14px, 2.4vw, 30px);
    pointer-events: auto;
    transform: translateY(-2vh);
  }
  .icon {
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    width: clamp(92px, 9vw, 128px);
    color: var(--ink); text-decoration: none;
    border-radius: 6px; padding: 6px 4px; outline: none;
  }
  .icon-art {
    width: var(--icon); aspect-ratio: 1; max-width: 100%;
    display: grid; place-items: center;
    filter: drop-shadow(0 4px 10px var(--shadow));
    transition: transform 0.18s ease;
  }
  .icon-art img, .icon-art svg { width: 100%; height: 100%; object-fit: contain; }
  .icon-label {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; text-align: center;
    text-shadow: 0 1px 3px var(--shadow), 0 0 10px var(--shadow);
    padding: 1px 4px; border-radius: 3px;
  }
  .icon:hover .icon-art { transform: translateY(-3px) scale(1.04); }
  .icon:focus-visible .icon-label { background: #2f6fe0; text-shadow: none; }
  .icon:active .icon-art { transform: scale(0.97); }

  @media (max-width: 520px) {
    :root { --icon: 64px; }
    .icon { width: 96px; }
  }
</style>
</head>
<body class="photo-page">

<canvas id="stage" aria-hidden="true"></canvas>
<div id="fallback" hidden></div>

<main class="desktop">
  <nav class="icons" id="icons" aria-label="Portfolio sections"></nav>
</main>

<div class="corner left" data-clock aria-label="Current time"></div>
<a class="corner right" href="index.html" data-section-name>Manu</a>

<script src="assets/site.js?v=20261111011631"></script>
<script src="assets/ripple.js?v=20261111011631"></script>
<script>
/* =========================================================
   PAGE SETTINGS
   ========================================================= */
const PAGE = {
  // Background photo. To swap it, put the new image in the
  // "images" folder and change this file name.
  background: "images/home-bg.jpg",
  // Photo used instead on phones and any tall or narrow window.
  mobileBackground: "images/about/about-hero.jpg",

  // Ripple effect. Same controls as Cargo's "Ripple" backdrop.
  ripple: {
    distortionX: 2,        // sideways wobble
    distortionY: 2,        // up-and-down wobble
    scale: 4.3,            // size of the ripples (higher = smaller, tighter ripples)
    speed: 4,              // how fast they drift on their own
    direction: 270,        // drift direction in degrees (0 = right, 90 = up, 180 = left, 270 = down)
    mouseInteraction: true,
    mouseSensitivity: 50,  // how much stronger ripples get around the mouse
    brightness: 1.15,      // photo brightness (1 = as shot, 1.15 = 15% brighter)
    phoneStrength: 2.2,    // how much stronger the ripple is on phones
    phoneAutoMotion: true  // on phones, the ripple drifts around on its own
  },

  // Desktop icons. "icon" is either a built-in drawing
  // ("pdf", "folder", "disc") or an image file like "images/photo-icon.png".
  // Optional: "size" makes an image icon bigger (1.5 = 50% bigger);
  // "outline: true" adds a soft light edge so dark drawings show up.
  icons: [
    { label: "Conceptual Art", icon: "pdf",    link: "conceptual-art.html" },
    { label: "Fashion Works",  icon: "images/icon-fashion-works.png", link: "fashion-works.html", size: 2 },
    { label: "Photography",    icon: "disc",   link: "photography.html" }
  ]
};

/* ---------- Built-in icon drawings ---------- */
const ICONS = {
  pdf: `<svg viewBox="0 0 100 100"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e7e5e0"/><stop offset="1" stop-color="#d6d2c9"/></linearGradient></defs>
    <path d="M22 6h40l18 18v68a2 2 0 0 1-2 2H22a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" fill="url(#pg)" stroke="#c9c9c4" stroke-width="1"/>
    <path d="M62 6v16a2 2 0 0 0 2 2h16" fill="#dcd9d2" stroke="#c9c9c4" stroke-width="1"/>
    <rect x="31" y="34" width="38" height="4" rx="1" fill="#c4c4bf"/><rect x="31" y="43" width="38" height="4" rx="1" fill="#c4c4bf"/><rect x="31" y="52" width="26" height="4" rx="1" fill="#c4c4bf"/>
    <text x="50" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9d9d98" letter-spacing="1">PDF</text></svg>`,
  folder: `<svg viewBox="0 0 100 100"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd0f7"/><stop offset="1" stop-color="#47aee6"/></linearGradient></defs>
    <path d="M8 24a4 4 0 0 1 4-4h24l7 7h45a4 4 0 0 1 4 4v8H8z" fill="#4aa7dc"/>
    <path d="M8 34a4 4 0 0 1 4-4h76a4 4 0 0 1 4 4v44a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4z" fill="url(#fg)"/>
    <path d="M8 36h84" stroke="#a9e2fb" stroke-width="1.5" opacity="0.8"/></svg>`,
  disc: `<svg viewBox="0 0 100 100"><defs><radialGradient id="dg" cx="0.35" cy="0.3" r="0.9"><stop offset="0" stop-color="#e7e5e0"/><stop offset="0.55" stop-color="#d3cfc6"/><stop offset="1" stop-color="#9aa3ad"/></radialGradient></defs>
    <circle cx="50" cy="50" r="42" fill="url(#dg)" stroke="#8b939c" stroke-width="1"/>
    <circle cx="50" cy="50" r="14" fill="#5d6670"/><circle cx="50" cy="50" r="9" fill="#2b3036"/><circle cx="46" cy="46" r="3" fill="#e7e5e0" opacity="0.6"/></svg>`
};

const iconsEl = document.getElementById("icons");
PAGE.icons.forEach(item => {
  const a = document.createElement("a");
  a.className = "icon";
  a.href = item.link;
  const art = ICONS[item.icon] ? ICONS[item.icon]
    : `<img src="${esc(item.icon)}" alt=""${item.outline ? ' class="drawn"' : ""}>`;
  // "size" widens this icon's space instead of zooming the picture,
  // so it stays sharp.
  const wide = item.size ? ` style="width: calc(var(--icon) * ${+item.size}); aspect-ratio: auto; height: var(--icon)"` : "";
  if (item.size) a.style.width = `calc(var(--icon) * ${+item.size} + 16px)`;
  a.innerHTML = `<span class="icon-art"${wide}>${art}</span><span class="icon-label">${esc(item.label)}</span>`;
  iconsEl.appendChild(a);
});

startRipple({
  canvas: document.getElementById("stage"),
  fallback: document.getElementById("fallback"),
  image: PAGE.background,
  tallImage: PAGE.mobileBackground,
  ripple: PAGE.ripple
});
</script>
</body>
</html>
