<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manu Portfolio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600&display=swap">
<style>
  /* Layout: full-bleed warping photo, desktop icons centered, clock and name pinned to the bottom corners */
  :root {
    --ink: #ffffff;
    --shadow: rgba(0, 0, 0, 0.55);
    --panel: rgba(17, 18, 16, 0.86);
    --panel-line: rgba(255, 255, 255, 0.14);
    --fallback-bg: #1b1d17;
    --font-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: var(--fallback-bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-weight: 500;
    -webkit-font-smoothing: antialiased;
  }

  /* Background */
  #stage, #fallback {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #fallback {
    background: var(--fallback-bg) center / cover no-repeat;
  }

  /* Desktop icons */
  .desktop {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
    padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  }
  .icons {
    display: flex;
    gap: clamp(14px, 2.4vw, 30px);
    flex-wrap: wrap;
    justify-content: center;
    pointer-events: auto;
    transform: translateY(-2vh);
  }
  .icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: clamp(92px, 9vw, 128px);
    color: var(--ink);
    text-decoration: none;
    border-radius: 6px;
    padding: 6px 4px;
    outline: none;
  }
  .icon-art {
    width: clamp(70px, 7.4vw, 112px);
    aspect-ratio: 1;
    max-width: 100%;
    display: grid;
    place-items: center;
    filter: drop-shadow(0 4px 10px var(--shadow));
    transition: transform 0.18s ease;
  }
  .icon-art img, .icon-art svg { width: 100%; height: 100%; object-fit: contain; }
  .icon-label {
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    text-align: center;
    text-shadow: 0 1px 3px var(--shadow), 0 0 10px var(--shadow);
    padding: 1px 4px;
    border-radius: 3px;
  }
  .icon:hover .icon-art { transform: translateY(-3px) scale(1.04); }
  .icon:focus-visible .icon-label { background: #2f6fe0; text-shadow: none; }
  .icon:active .icon-art { transform: scale(0.97); }

  /* Corners */
  .corner {
    position: fixed;
    font-size: 15px;
    text-shadow: 0 1px 3px var(--shadow);
    font-variant-numeric: tabular-nums;
    z-index: 2;
  }
  .clock {
    left: max(28px, calc(env(safe-area-inset-left, 0px) + 16px));
    bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  }
  .brand {
    right: max(14px, calc(env(safe-area-inset-right, 0px) + 12px));
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    font-weight: 600;
    font-size: 16px;
  }

  /* Menu */
  .menu-btn {
    position: fixed;
    top: calc(26px + env(safe-area-inset-top, 0px));
    right: max(26px, calc(env(safe-area-inset-right, 0px) + 16px));
    display: flex;
    gap: 6px;
    padding: 10px 6px;
    background: none;
    border: 0;
    cursor: pointer;
    z-index: 4;
    border-radius: 6px;
  }
  .menu-btn span {
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 0 1px 4px var(--shadow);
  }
  .menu-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .menu {
    position: fixed;
    top: calc(64px + env(safe-area-inset-top, 0px));
    right: max(20px, calc(env(safe-area-inset-right, 0px) + 12px));
    min-width: 200px;
    max-width: calc(100vw - 32px);
    background: var(--panel);
    border: 1px solid var(--panel-line);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-radius: 6px;
    padding: 6px;
    display: flex;
    flex-direction: column;
    z-index: 4;
  }
  .menu a {
    color: var(--ink);
    text-decoration: none;
    font-size: 15px;
    padding: 9px 12px;
    border-radius: 4px;
  }
  .menu a:hover, .menu a:focus-visible { background: rgba(255, 255, 255, 0.1); outline: none; }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(56px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    background: var(--panel);
    border: 1px solid var(--panel-line);
    padding: 9px 14px;
    border-radius: 6px;
    font-size: 14px;
    z-index: 5;
    white-space: nowrap;
  }

  @media (max-width: 520px) {
    .icon { width: 96px; }
    .icon-art { width: 70px; }
    .corner { font-size: 13px; }
    .brand { font-size: 14px; }
  }
</style>
</head>
<body>

<canvas id="stage" aria-hidden="true"></canvas>
<div id="fallback" hidden></div>

<main class="desktop">
  <nav class="icons" id="icons" aria-label="Portfolio sections"></nav>
</main>

<button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menu">
  <span></span><span></span><span></span>
</button>
<div class="menu" id="menu" hidden></div>

<div class="corner clock" id="clock" aria-label="Current time"></div>
<div class="corner brand">Manu Clothing</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* =========================================================
   SITE SETTINGS — change these to update the page.
   ========================================================= */
const SITE = {
  // Background photo. To swap it, put the new image in the
  // "images" folder and change this file name.
  background: "images/home-bg.jpg",

  // Ripple effect. Same controls as Cargo's "Ripple" backdrop.
  ripple: {
    distortionX: 2,        // sideways wobble
    distortionY: 2,        // up-and-down wobble
    scale: 4.3,            // size of the ripples (higher = smaller, tighter ripples)
    speed: 4,              // how fast they drift on their own
    direction: 270,        // drift direction in degrees (0 = right, 90 = up, 180 = left, 270 = down)
    mouseInteraction: true,
    mouseSensitivity: 50   // how much stronger ripples get around the mouse
  },

  // Desktop icons. "icon" is either a built-in drawing
  // ("pdf", "folder", "disc") or an image file like "images/photo-icon.png".
  icons: [
    { label: "Conceptual Art", icon: "pdf",    link: "conceptual-art.html", ready: false },
    { label: "Fashion Works",  icon: "folder", link: "fashion-works.html",  ready: false },
    { label: "Photography",    icon: "disc",   link: "photography.html",    ready: true }
  ],

  // Menu (three dots, top right). "ready: false" shows a note instead of a broken link.
  menu: [
    { label: "Fashion Works",      link: "fashion-works.html",  ready: false },
    { label: "Conceptual Art",     link: "conceptual-art.html", ready: false },
    { label: "Photography",        link: "photography.html",    ready: true },
    { label: "Commissions",        link: "commissions.html",    ready: false },
    { label: "About Me / Contact", link: "about.html",          ready: false }
  ]
};

/* ---------- Built-in icon drawings ---------- */
const ICONS = {
  pdf: `<svg viewBox="0 0 100 100"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e6e3"/></linearGradient></defs>
    <path d="M22 6h40l18 18v68a2 2 0 0 1-2 2H22a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2z" fill="url(#pg)" stroke="#c9c9c4" stroke-width="1"/>
    <path d="M62 6v16a2 2 0 0 0 2 2h16" fill="#dcdcd7" stroke="#c9c9c4" stroke-width="1"/>
    <rect x="31" y="34" width="38" height="4" rx="1" fill="#c4c4bf"/><rect x="31" y="43" width="38" height="4" rx="1" fill="#c4c4bf"/><rect x="31" y="52" width="26" height="4" rx="1" fill="#c4c4bf"/>
    <text x="50" y="84" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#9d9d98" letter-spacing="1">PDF</text></svg>`,
  folder: `<svg viewBox="0 0 100 100"><defs><linearGradient id="fg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd0f7"/><stop offset="1" stop-color="#47aee6"/></linearGradient></defs>
    <path d="M8 24a4 4 0 0 1 4-4h24l7 7h45a4 4 0 0 1 4 4v8H8z" fill="#4aa7dc"/>
    <path d="M8 34a4 4 0 0 1 4-4h76a4 4 0 0 1 4 4v44a4 4 0 0 1-4 4H12a4 4 0 0 1-4-4z" fill="url(#fg)"/>
    <path d="M8 36h84" stroke="#a9e2fb" stroke-width="1.5" opacity="0.8"/></svg>`,
  disc: `<svg viewBox="0 0 100 100"><defs><radialGradient id="dg" cx="0.35" cy="0.3" r="0.9"><stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#d9dde3"/><stop offset="1" stop-color="#9aa3ad"/></radialGradient></defs>
    <circle cx="50" cy="50" r="42" fill="url(#dg)" stroke="#8b939c" stroke-width="1"/>
    <circle cx="50" cy="50" r="14" fill="#5d6670"/><circle cx="50" cy="50" r="9" fill="#2b3036"/><circle cx="46" cy="46" r="3" fill="#ffffff" opacity="0.6"/></svg>`
};

/* ---------- Icons and menu ---------- */
const iconsEl = document.getElementById("icons");
SITE.icons.forEach(item => {
  const a = document.createElement("a");
  a.className = "icon";
  a.href = item.link;
  if (!item.ready) a.dataset.soon = "1";
  const art = ICONS[item.icon]
    ? ICONS[item.icon]
    : `<img src="${item.icon}" alt="">`;
  a.innerHTML = `<span class="icon-art">${art}</span><span class="icon-label">${item.label}</span>`;
  iconsEl.appendChild(a);
});

const menu = document.getElementById("menu");
const menuBtn = document.getElementById("menuBtn");
SITE.menu.forEach(item => {
  const a = document.createElement("a");
  a.href = item.link;
  if (!item.ready) a.dataset.soon = "1";
  a.textContent = item.label;
  menu.appendChild(a);
});
menuBtn.addEventListener("click", e => {
  e.stopPropagation();
  menu.hidden = !menu.hidden;
  menuBtn.setAttribute("aria-expanded", String(!menu.hidden));
});
document.addEventListener("click", e => {
  if (!menu.hidden && !menu.contains(e.target)) {
    menu.hidden = true;
    menuBtn.setAttribute("aria-expanded", "false");
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { menu.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); }
});

// Pages not built yet: show a note instead of a broken link.
const toast = document.getElementById("toast");
let toastTimer;
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-soon]");
  if (!a) return;
  e.preventDefault();
  toast.textContent = `${a.textContent.trim()} page is coming next`;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, 1800);
});

/* ---------- Clock ---------- */
const clockEl = document.getElementById("clock");
function tick() {
  clockEl.textContent = new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit", second: "2-digit" });
}
tick();
setInterval(tick, 1000);

/* ---------- Liquid background ---------- */
(function liquidBackground() {
  const canvas = document.getElementById("stage");
  const fallback = document.getElementById("fallback");
  const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const gl = canvas.getContext("webgl2", { antialias: false, premultipliedAlpha: false });

  function useFallback() {
    canvas.hidden = true;
    fallback.hidden = false;
    fallback.style.backgroundImage = `url("${SITE.background}")`;
  }
  if (!gl || reduceMotion) { useFallback(); return; }
  const R = SITE.ripple;

  const halfFloat = !!gl.getExtension("EXT_color_buffer_float");
  const SIM = 128;

  const vert = `#version 300 es
    in vec2 aPos; out vec2 vUv;
    void main(){ vUv = aPos * 0.5 + 0.5; gl_Position = vec4(aPos, 0.0, 1.0); }`;

  // Flow map: remembers recent cursor motion and lets it fade.
  const flowFrag = `#version 300 es
    precision highp float;
    in vec2 vUv; out vec4 outColor;
    uniform sampler2D uFlow;
    uniform vec2 uMouse, uVel;
    uniform float uAspect, uRadius, uSettle, uEncoded, uActive;
    vec3 decode(vec4 c){ return uEncoded > 0.5 ? vec3(c.xy * 2.0 - 1.0, c.z) : c.xyz; }
    vec4 encode(vec3 v){ return uEncoded > 0.5 ? vec4(v.xy * 0.5 + 0.5, v.z, 1.0) : vec4(v, 1.0); }
    void main(){
      vec3 f = decode(texture(uFlow, vUv)) * uSettle;
      vec2 d = vUv - uMouse; d.x *= uAspect;
      float speed = min(1.0, length(uVel));
      vec3 stamp = vec3(uVel, 1.0 - pow(1.0 - speed, 3.0));
      float fall = smoothstep(uRadius, 0.0, length(d));
      fall = fall * fall * 0.35 * uActive;
      f = mix(f, stamp, fall);
      outColor = encode(f);
    }`;

  // Final image: the photo pushed around by drifting ripples. Near the mouse,
  // the flow map makes the ripples stronger and adds a small push.
  const showFrag = `#version 300 es
    precision highp float;
    in vec2 vUv; out vec4 outColor;
    uniform sampler2D uImage, uFlow;
    uniform vec2 uCover, uAmp, uDrift;
    uniform float uEncoded, uTime, uFreq, uAspect, uMouseBoost;

    // Soft ridge along the edges between curvy, moving cells (0 inside a cell, 1 on a line).
    float ripple(vec2 p){
      vec2 q = p + 0.25 * vec2(sin(p.y * 1.3 + uTime * 0.7), cos(p.x * 1.2 - uTime * 0.6))
                 + 0.12 * vec2(sin(p.y * 3.1 - uTime), cos(p.x * 2.9 + uTime * 0.9));
      vec2 cell = floor(q), fr = fract(q);
      float F1 = 9.0, F2 = 9.0;
      for (int j = -1; j <= 1; j++) for (int i = -1; i <= 1; i++) {
        vec2 g = vec2(float(i), float(j));
        vec2 h = fract(sin(vec2(dot(cell + g, vec2(127.1, 311.7)), dot(cell + g, vec2(269.5, 183.3)))) * 43758.5453);
        vec2 o = 0.5 + 0.4 * sin(uTime * vec2(0.8, 0.9) + 6.2831 * h);
        float d = length(g + o - fr);
        if (d < F1) { F2 = F1; F1 = d; } else if (d < F2) { F2 = d; }
      }
      // Wide, soft falloff: the warp follows the ripple shapes without drawing hard lines.
      float edge = (F2 - F1) / 0.42;
      return exp(-edge * edge);
    }

    // Smooth swells, so the ripple shapes read as water and not as drawn lines.
    float swell(vec2 p){
      return 0.5 * sin(p.x * 0.9 + sin(p.y * 0.7 + uTime * 0.5) + uTime * 0.6)
           + 0.5 * sin(p.y * 1.1 + sin(p.x * 0.8 - uTime * 0.4) - uTime * 0.5);
    }

    float water(vec2 p){ return 0.55 * ripple(p) + 0.2 * swell(p); }

    void main(){
      vec4 c = texture(uFlow, vUv);
      vec3 f = uEncoded > 0.5 ? vec3(c.xy * 2.0 - 1.0, c.z) : c.xyz;

      // Underwater look: soft pool-ripple shapes blended with gentle swells.
      vec2 p = vec2(vUv.x * uAspect, vUv.y) * uFreq - uDrift;
      float e = 0.06;
      float c0 = water(p);
      vec2 grad = vec2(water(p + vec2(e, 0.0)) - c0, water(p + vec2(0.0, e)) - c0) / e;
      // The image bends gently along the lines and stays put inside each shape.
      vec2 cellWarp = grad / uFreq;

      float boost = 1.0 + f.z * uMouseBoost;
      vec2 offset = cellWarp * uAmp * boost + f.xy * f.z * 0.006 * uMouseBoost;

      vec2 uv = vUv + offset;
      uv = (uv - 0.5) * uCover + 0.5;
      outColor = texture(uImage, clamp(uv, 0.001, 0.999));
    }`;

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(fs) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vert));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
    gl.bindAttribLocation(p, 0, "aPos");
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
    const u = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    for (let i = 0; i < n; i++) { const name = gl.getActiveUniform(p, i).name; u[name] = gl.getUniformLocation(p, name); }
    return { p, u };
  }

  let flowProg, showProg;
  try { flowProg = program(flowFrag); showProg = program(showFrag); }
  catch (err) { console.warn(err); useFallback(); return; }

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  function makeTarget() {
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    if (halfFloat) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA16F, SIM, SIM, 0, gl.RGBA, gl.HALF_FLOAT, null);
    else {
      const blank = new Uint8Array(SIM * SIM * 4);
      for (let i = 0; i < blank.length; i += 4) { blank[i] = 128; blank[i + 1] = 128; blank[i + 3] = 255; }
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, SIM, SIM, 0, gl.RGBA, gl.UNSIGNED_BYTE, blank);
    }
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    const fb = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, fb);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
    return { tex, fb };
  }
  let read = makeTarget(), write = makeTarget();
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);

  const imageTex = gl.createTexture();
  let imgW = 1, imgH = 1, ready = false;
  const img = new Image();
  img.onload = () => {
    imgW = img.naturalWidth; imgH = img.naturalHeight;
    gl.bindTexture(gl.TEXTURE_2D, imageTex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);
    gl.generateMipmap(gl.TEXTURE_2D);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    ready = true;
  };
  img.onerror = useFallback;
  img.src = SITE.background;

  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(innerWidth * dpr);
    canvas.height = Math.round(innerHeight * dpr);
  }
  resize();
  addEventListener("resize", resize);

  // Pointer tracking (mouse and touch)
  const mouse = { x: 0.5, y: 0.5 }, last = { x: 0.5, y: 0.5 }, vel = { x: 0, y: 0 };
  let lastMove = 0, hasPointer = false;
  function onMove(x, y) {
    mouse.x = x / innerWidth;
    mouse.y = 1 - y / innerHeight;
    if (!hasPointer) { last.x = mouse.x; last.y = mouse.y; hasPointer = true; }
    lastMove = performance.now();
  }
  addEventListener("pointermove", e => onMove(e.clientX, e.clientY), { passive: true });
  addEventListener("pointerdown", e => onMove(e.clientX, e.clientY), { passive: true });

  let prevT = performance.now();
  const drift = { x: 0, y: 0 }, push = { x: 0, y: 0 };
  let anim = 0;
  function frame(t) {
    const dt = Math.max(0.001, Math.min(0.05, (t - prevT) / 1000));
    prevT = t;

    // Cursor speed in screen-widths per second, eased so the smear feels liquid.
    const moving = t - lastMove < 80;
    let tx = moving ? (mouse.x - last.x) / dt * 0.35 : 0;
    let ty = moving ? (mouse.y - last.y) / dt * 0.35 : 0;
    const len = Math.hypot(tx, ty);
    if (len > 1) { tx /= len; ty /= len; }
    vel.x += (tx - vel.x) * 0.3;
    vel.y += (ty - vel.y) * 0.3;
    last.x = mouse.x; last.y = mouse.y;

    const aspect = innerWidth / innerHeight;

    // Drift: the ripples flow in the set direction, and moving the mouse
    // speeds them up and pulls them along the way the mouse is going.
    const sens = R.mouseInteraction ? R.mouseSensitivity / 50 : 0;
    push.x += (vel.x - push.x) * (Math.hypot(vel.x, vel.y) > Math.hypot(push.x, push.y) ? 0.12 : 0.025);
    push.y += (vel.y - push.y) * (Math.hypot(vel.x, vel.y) > Math.hypot(push.x, push.y) ? 0.12 : 0.025);
    const ang = R.direction * Math.PI / 180;
    const base = R.speed * 0.07;
    drift.x += (Math.cos(ang) * base + push.x * aspect * 1.2 * sens) * dt;
    drift.y += (Math.sin(ang) * base + push.y * 1.2 * sens) * dt;
    anim += dt * R.speed * 0.12 * (1 + Math.hypot(push.x, push.y) * 2.5 * sens);

    // Update the flow map
    gl.viewport(0, 0, SIM, SIM);
    gl.bindFramebuffer(gl.FRAMEBUFFER, write.fb);
    gl.useProgram(flowProg.p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, read.tex);
    gl.uniform1i(flowProg.u.uFlow, 0);
    gl.uniform2f(flowProg.u.uMouse, mouse.x, mouse.y);
    gl.uniform2f(flowProg.u.uVel, vel.x, vel.y);
    gl.uniform1f(flowProg.u.uAspect, aspect);
    gl.uniform1f(flowProg.u.uRadius, 0.3);
    gl.uniform1f(flowProg.u.uSettle, 0.985);
    gl.uniform1f(flowProg.u.uEncoded, halfFloat ? 0 : 1);
    gl.uniform1f(flowProg.u.uActive, hasPointer && R.mouseInteraction ? 1 : 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    [read, write] = [write, read];

    // Draw the photo
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
    if (ready) {
      gl.useProgram(showProg.p);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, imageTex);
      gl.uniform1i(showProg.u.uImage, 0);
      gl.activeTexture(gl.TEXTURE1);
      gl.bindTexture(gl.TEXTURE_2D, read.tex);
      gl.uniform1i(showProg.u.uFlow, 1);
      const imgAspect = imgW / imgH;
      const cover = aspect > imgAspect ? [1, imgAspect / aspect] : [aspect / imgAspect, 1];
      gl.uniform2f(showProg.u.uCover, cover[0], cover[1]);
      // Translate Cargo-style numbers into shader values.
      gl.uniform2f(showProg.u.uDrift, drift.x, drift.y);
      gl.uniform2f(showProg.u.uAmp, R.distortionX * 0.006, R.distortionY * 0.006);
      gl.uniform1f(showProg.u.uFreq, R.scale * 2.8);
      gl.uniform1f(showProg.u.uTime, anim);
      gl.uniform1f(showProg.u.uAspect, aspect);
      gl.uniform1f(showProg.u.uMouseBoost, R.mouseInteraction ? R.mouseSensitivity / 50 * 2.5 : 0);
      gl.uniform1f(showProg.u.uEncoded, halfFloat ? 0 : 1);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
