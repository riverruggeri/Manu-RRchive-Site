<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Manu Photography</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;800&display=swap">
<style>
  /* Layout: giant title, then one centered project after another: info row, warping slideshow, counter */
  :root {
    --bg: #565656;
    --ink: #ffffff;
    --ink-soft: rgba(255, 255, 255, 0.72);
    --panel: #161616;
    --panel-line: rgba(255, 255, 255, 0.16);
    --empty: #2f2f2f;
    --font-ui: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
    color-scheme: dark;
  }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-ui);
    font-weight: 500;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 120px;
  }

  /* Title */
  .page-title {
    margin: 0;
    padding-top: clamp(28px, 5vw, 70px);
    font-weight: 800;
    font-size: clamp(54px, 12.6vw, 230px);
    line-height: 0.9;
    letter-spacing: -0.035em;
    text-transform: uppercase;
    text-align: center;
    text-wrap: balance;
    overflow-wrap: anywhere;
  }

  /* Projects */
  .projects { display: flex; flex-direction: column; gap: clamp(70px, 9vw, 140px); margin-top: clamp(40px, 6vw, 90px); }
  .project { display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .info {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    gap: 12px;
    font-size: 14px;
  }
  .year { display: flex; align-items: center; gap: 9px; font-variant-numeric: tabular-nums; }
  .year::before { content: ""; width: 9px; height: 9px; background: var(--ink); }
  .name { text-align: center; min-width: 0; }
  .more {
    justify-self: end;
    background: none; border: 0; padding: 4px 0;
    color: var(--ink); font: inherit; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .more:hover { text-decoration: underline; text-underline-offset: 3px; }
  .more:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* Slideshow */
  .show { position: relative; width: 100%; display: flex; justify-content: center; }
  .frame {
    position: relative;
    cursor: pointer;
    will-change: transform;
    transform-origin: 50% 50%;
    max-width: 100%;
  }
  .frame img {
    display: block;
    max-width: min(100%, 680px);
    max-height: 78vh;
    width: auto;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
  }
  .frame.portrait img { max-width: min(100%, 440px); }
  .frame .empty {
    width: min(86vw, 640px);
    aspect-ratio: 4 / 3;
    max-width: 100%;
    background: var(--empty);
    display: grid;
    place-items: center;
    color: var(--ink-soft);
    font-size: 12px;
    letter-spacing: 0.04em;
  }
  .arrow {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; border-radius: 50%;
    border: 1px solid rgba(255, 255, 255, 0.5);
    background: rgba(0, 0, 0, 0.18);
    color: var(--ink); cursor: pointer;
    display: grid; place-items: center;
    font: inherit; font-size: 14px; line-height: 1;
    opacity: 0; transition: opacity 0.2s;
  }
  .arrow.prev { left: 0; }
  .arrow.next { right: 0; }
  .show:hover .arrow, .arrow:focus-visible { opacity: 1; }
  .count { font-size: 11px; color: var(--ink-soft); font-variant-numeric: tabular-nums; letter-spacing: 0.04em; }

  /* "More" panel */
  .panel {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(480px, 100vw);
    background: var(--panel);
    z-index: 10;
    display: flex; flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-right: env(safe-area-inset-right, 0px);
  }
  .panel.open { transform: translateX(0); }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 14px; font-size: 14px;
  }
  .panel-head .year::before { margin-right: 0; }
  .close {
    background: none; border: 0; color: var(--ink); cursor: pointer;
    font: inherit; font-size: 20px; line-height: 1; padding: 4px 6px;
  }
  .close:focus-visible { outline: 2px solid var(--ink); }
  .panel-body { overflow-y: auto; padding: 0 14px 28px; display: flex; flex-direction: column; gap: 22px; }
  .thumbs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .thumbs button { padding: 0; border: 0; background: #222; cursor: pointer; aspect-ratio: 3 / 4; overflow: hidden; }
  .thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumbs button:focus-visible { outline: 2px solid var(--ink); }
  .text {
    display: grid; grid-template-columns: 9.5em 1fr; gap: 6px 14px;
    border-top: 1px solid var(--panel-line); padding-top: 10px;
    font-size: 13px; line-height: 1.38;
  }
  .text h3 { margin: 0 0 10px; font-size: 13px; font-weight: 600; }
  .text p { margin: 0 0 0.9em; }
  .text > div { min-width: 0; }
  .scrim { position: fixed; inset: 0; z-index: 9; background: rgba(0, 0, 0, 0.25); }

  /* Menu (same as portfolio) */
  .menu-btn {
    position: fixed;
    top: calc(22px + env(safe-area-inset-top, 0px));
    right: max(22px, calc(env(safe-area-inset-right, 0px) + 16px));
    display: flex; gap: 6px; padding: 10px 6px;
    background: none; border: 0; cursor: pointer; z-index: 8; border-radius: 6px;
  }
  .menu-btn span { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.35); }
  .menu-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .menu {
    position: fixed;
    top: calc(60px + env(safe-area-inset-top, 0px));
    right: max(16px, calc(env(safe-area-inset-right, 0px) + 12px));
    min-width: 200px; max-width: calc(100vw - 32px);
    background: rgba(22, 22, 22, 0.94);
    border: 1px solid var(--panel-line);
    border-radius: 6px; padding: 6px;
    display: flex; flex-direction: column; z-index: 8;
  }
  .menu a { color: var(--ink); text-decoration: none; padding: 9px 12px; border-radius: 4px; }
  .menu a:hover, .menu a:focus-visible { background: rgba(255,255,255,0.1); outline: none; }
  .toast {
    position: fixed; left: 50%; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%);
    background: rgba(22, 22, 22, 0.94); border: 1px solid var(--panel-line);
    padding: 9px 14px; border-radius: 6px; font-size: 14px; z-index: 12; white-space: nowrap;
  }

  @media (max-width: 600px) {
    .info { grid-template-columns: auto 1fr auto; font-size: 13px; }
    .arrow { opacity: 1; width: 26px; height: 26px; }
    .text { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) {
    .panel { transition: none; }
  }
</style>
</head>
<body>

<div class="page">
  <h1 class="page-title" id="pageTitle"></h1>
  <main class="projects" id="projects"></main>
</div>

<button class="menu-btn" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="menu"><span></span><span></span><span></span></button>
<nav class="menu" id="menu" hidden></nav>

<div class="scrim" id="scrim" hidden></div>
<aside class="panel" id="panel" aria-hidden="true" aria-labelledby="panelTitle">
  <div class="panel-head">
    <span class="year" id="panelTitle"></span>
    <button class="close" id="closePanel" aria-label="Close">&times;</button>
  </div>
  <div class="panel-body">
    <div class="thumbs" id="panelThumbs"></div>
    <div class="text">
      <div><h3>Details</h3><div id="panelDetails"></div></div>
      <div><h3>Overview</h3><div id="panelOverview"></div></div>
    </div>
  </div>
</aside>
<div class="toast" id="toast" role="status" hidden></div>

<script>
/* =========================================================
   PAGE SETTINGS
   ========================================================= */
const PAGE = {
  title: "Photography",

  // How much the photos bend while scrolling (0 = off, 1 = normal, 2 = strong)
  scrollWarp: 1
};

/* =========================================================
   PROJECTS — one block per project, shown top to bottom.

   TO ADD A NEW PROJECT: copy the template below, paste it
   where you want it in the list, and fill it in.

   {
     year: "2026",
     title: "Project Name",           // leave "" if it has no title
     medium: "Digital Photography",
     photos: [
       "images/photography/my-photo-1.jpg",
       "images/photography/my-photo-2.jpg"
     ],
     details: ["2026", "Digital Photography"],   // lines shown under "Details"
     overview: `Write about the project here.

     A blank line starts a new paragraph.`
   },

   Put the photo files in the images/photography folder.
   ========================================================= */
const PROJECTS = [
  {
    year: "2025",
    title: "Drag Me Down",
    medium: "Digital Photography",
    photos: ["images/photography/drag-me-down-1.jpg"],   // stand-in from the screen recording
    details: ["2025", "Digital Photography"],
    overview: `This photograph captures a striking moment suspended between fashion, performance, and wilderness. Shot in a natural woodland setting with a Fujifilm X-T100 and illuminated using a portable strobe, the image blends dramatic artificial lighting with organic textures and shadows from the surrounding trees.

The subject appears almost sculptural, draped across the branches in dark flowing fabric that contrasts against the bright sunlight filtering through the canopy. The interplay of light and shadow creates a cinematic atmosphere, while the unusual pose and composition give the image a surreal, almost dreamlike quality.

The result is a visually layered portrait that explores both the raw beauty of nature and the expressive possibilities of staged photography.`
  },
  {
    year: "2026",
    title: "",
    medium: "Fashion Photography, Digital Photography",
    photos: ["images/photography/log-1.jpg"],             // stand-in from the screen recording
    details: ["2026", "Fashion Photography", "Digital Photography"],
    overview: ``
  },
  {
    year: "2026",
    title: "Riding Back",
    medium: "Digital Photography",
    photos: ["images/photography/riding-back-1.jpg"],     // stand-in from the screen recording
    details: ["2026", "Digital Photography"],
    overview: ``
  },
  {
    year: "2025",
    title: "Blending With Nature",
    medium: "Digital Photography",
    photos: [],                                           // add photos here
    details: ["2025", "Digital Photography"],
    overview: ``
  }
];

/* Menu (three dots, top right). "ready: false" shows a note instead of a broken link. */
const MENU = [
  { label: "Portfolio",          link: "portfolio.html",      ready: true },
  { label: "Fashion Works",      link: "fashion-works.html",  ready: false },
  { label: "Conceptual Art",     link: "conceptual-art.html", ready: false },
  { label: "Photography",        link: "photography.html",    ready: true },
  { label: "Commissions",        link: "commissions.html",    ready: false },
  { label: "About Me / Contact", link: "about.html",          ready: false }
];

/* ---------- Build the page ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const label = p => (p.title ? `“${esc(p.title)}”, ` : "") + esc(p.medium);
const pad = n => String(n).padStart(2, "0");

document.getElementById("pageTitle").textContent = PAGE.title;
document.title = "Manu " + PAGE.title;

const list = document.getElementById("projects");
const frames = [];

PROJECTS.forEach((p, i) => {
  const el = document.createElement("article");
  el.className = "project";
  el.innerHTML = `
    <div class="info">
      <span class="year">${esc(p.year)}</span>
      <span class="name">${label(p)}</span>
      <button class="more" data-i="${i}" aria-label="More about ${esc(p.title || p.medium)}">More <span aria-hidden="true">→</span></button>
    </div>
    <div class="show">
      <div class="frame"></div>
      ${p.photos.length > 1 ? `<button class="arrow prev" aria-label="Previous photo">‹</button><button class="arrow next" aria-label="Next photo">›</button>` : ""}
    </div>
    <div class="count"></div>`;
  list.appendChild(el);

  const frame = el.querySelector(".frame");
  const count = el.querySelector(".count");
  frames.push(frame);
  let at = 0;

  function show(n) {
    if (!p.photos.length) {
      frame.innerHTML = `<div class="empty">Photos coming soon</div>`;
      count.textContent = "";
      return;
    }
    at = (n + p.photos.length) % p.photos.length;
    const img = new Image();
    img.alt = (p.title || p.medium) + ", photo " + (at + 1);
    img.decoding = "async";
    img.onload = () => frame.classList.toggle("portrait", img.naturalHeight > img.naturalWidth);
    img.src = p.photos[at];
    frame.replaceChildren(img);
    count.textContent = `${pad(at + 1)} / ${pad(p.photos.length)}`;
  }
  show(0);
  frame.addEventListener("click", () => show(at + 1));
  el.querySelector(".prev")?.addEventListener("click", () => show(at - 1));
  el.querySelector(".next")?.addEventListener("click", () => show(at + 1));
  p._show = show;
});

/* ---------- "More" panel ---------- */
const panel = document.getElementById("panel");
const scrim = document.getElementById("scrim");
let lastFocus = null;

function openPanel(i) {
  const p = PROJECTS[i];
  lastFocus = document.activeElement;
  document.getElementById("panelTitle").textContent = p.title || p.medium;
  document.getElementById("panelDetails").innerHTML = (p.details || []).map(d => `<div>${esc(d)}</div>`).join("");
  const paras = (p.overview || "").split(/\n\s*\n/).map(s => s.trim()).filter(Boolean);
  document.getElementById("panelOverview").innerHTML = paras.length
    ? paras.map(s => `<p>${esc(s)}</p>`).join("")
    : `<p style="color:var(--ink-soft)">No description yet.</p>`;
  const thumbs = document.getElementById("panelThumbs");
  thumbs.innerHTML = p.photos.map((src, n) => `<button data-n="${n}" aria-label="Show photo ${n + 1}"><img src="${esc(src)}" alt=""></button>`).join("");
  thumbs.hidden = !p.photos.length;
  thumbs.onclick = e => { const b = e.target.closest("button"); if (b) p._show(+b.dataset.n); };
  panel.classList.add("open");
  panel.setAttribute("aria-hidden", "false");
  scrim.hidden = false;
  document.getElementById("closePanel").focus();
}
function closePanel() {
  panel.classList.remove("open");
  panel.setAttribute("aria-hidden", "true");
  scrim.hidden = true;
  lastFocus?.focus?.();
}
list.addEventListener("click", e => { const b = e.target.closest(".more"); if (b) openPanel(+b.dataset.i); });
document.getElementById("closePanel").addEventListener("click", closePanel);
scrim.addEventListener("click", closePanel);

/* ---------- Menu ---------- */
const menu = document.getElementById("menu");
const menuBtn = document.getElementById("menuBtn");
const toast = document.getElementById("toast");
let toastTimer;
MENU.forEach(m => {
  const a = document.createElement("a");
  a.href = m.link; a.textContent = m.label;
  if (!m.ready) a.addEventListener("click", e => {
    e.preventDefault();
    toast.textContent = `${m.label} page is coming next`;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.hidden = true, 1800);
  });
  menu.appendChild(a);
});
menuBtn.addEventListener("click", e => {
  e.stopPropagation();
  menu.hidden = !menu.hidden;
  menuBtn.setAttribute("aria-expanded", String(!menu.hidden));
});
document.addEventListener("click", e => {
  if (!menu.hidden && !menu.contains(e.target)) { menu.hidden = true; menuBtn.setAttribute("aria-expanded", "false"); }
});
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  menu.hidden = true; menuBtn.setAttribute("aria-expanded", "false");
  if (panel.classList.contains("open")) closePanel();
});

/* ---------- Scroll warp ----------
   While scrolling, photos tilt and bend with the scroll speed,
   then ease back flat when scrolling stops. */
(function scrollWarp() {
  if (window.matchMedia("(prefers-reduced-motion: reduce)").matches || !PAGE.scrollWarp) return;
  let lastY = scrollY, lastT = performance.now(), v = 0, shown = 0;
  function frame(t) {
    const dt = Math.max(1, t - lastT);
    const raw = (scrollY - lastY) / dt;          // pixels per millisecond
    lastY = scrollY; lastT = t;
    v += (raw - v) * 0.2;                        // smooth the speed
    shown += (v - shown) * 0.12;                 // ease the warp in and out
    if (Math.abs(shown) < 0.0005) shown = 0;
    const k = Math.max(-1.6, Math.min(1.6, shown)) * PAGE.scrollWarp;
    const vh = innerHeight;
    for (const f of frames) {
      const r = f.getBoundingClientRect();
      if (r.bottom < -100 || r.top > vh + 100) continue;
      // Photos above and below the middle of the screen tilt in opposite directions.
      const pos = ((r.top + r.height / 2) / vh - 0.5) * 2;
      const rotX = -k * 9;
      const skew = k * 2.2 * (pos >= 0 ? 1 : -1) * Math.min(1, Math.abs(pos) + 0.3);
      const rot = k * 1.4 * pos;
      const sy = 1 + Math.abs(k) * 0.06;
      f.style.transform = shown === 0 ? "" :
        `perspective(900px) rotateX(${rotX}deg) skewY(${skew}deg) rotate(${rot}deg) scaleY(${sy})`;
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
